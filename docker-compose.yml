version: "3.8"
services:
  flask-dia:
    build:
      context: https://github.com/tarunravi/dia-tts.git
      dockerfile: Dockerfile
    runtime: nvidia
    ports:
      - "5023:5023"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped